<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizador | Jonets Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A365D;--deep:#0A1128;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e7e7e9;--bg:#f5f6f8;--ok:#1A365D;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;max-width:100%;}
body{font-family:'Plus Jakarta Sans',-apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
.app{max-width:1220px;margin:0 auto;padding:22px;display:grid;grid-template-columns:1.15fr 1fr;gap:22px;}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;min-width:0;}
h1{font-size:1.15rem;color:var(--deep);font-weight:800;letter-spacing:-.01em;}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px;grid-column:1/-1;background:var(--deep);color:#fff;border-radius:var(--radius);padding:16px 22px;}
.brand h1{color:#fff;font-size:1.25rem;}
.brand span{font-size:.78rem;color:#aab4c5;letter-spacing:.12em;text-transform:uppercase;}
h2{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:14px;}
.controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
input,select,textarea{font-family:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);width:100%;background:#fff;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);}
.search{flex:2;min-width:180px;}.filter{flex:1;min-width:130px;}
.list{max-height:52vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;}
.prod{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;}
.prod:last-child{border-bottom:none;}
.prod:hover{background:#f6f8fb;}
.prod .info{flex:1;min-width:0;}
.prod .nm{font-size:.88rem;font-weight:600;color:var(--deep);}
.prod .ct{font-size:.72rem;color:var(--muted);}
.prod .pr{font-size:.86rem;font-weight:700;color:var(--navy);white-space:nowrap;}
.prod .add{border:none;background:var(--navy);color:#fff;width:30px;height:30px;border-radius:8px;font-size:1.1rem;cursor:pointer;flex:none;line-height:1;}
.prod .add:hover{background:var(--deep);}
.thumb{width:48px;height:48px;border-radius:8px;border:1px solid var(--line);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff;}
.thumb img{width:100%;height:100%;object-fit:contain;}
.thumb span{color:#cfd3da;font-size:1rem;}
.cthumb{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);object-fit:contain;background:#fff;vertical-align:middle;margin-right:7px;}
td .noimg{display:inline-block;width:30px;height:30px;border-radius:6px;border:1px solid var(--line);vertical-align:middle;margin-right:7px;}
.cust{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.cust .full{grid-column:1/-1;}
label{font-size:.72rem;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;}
table{width:100%;border-collapse:collapse;font-size:.85rem;}
thead th{text-align:left;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 6px;}
tbody td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle;}
td.r,th.r{text-align:right;}
.qty{width:58px;text-align:center;padding:6px;}
.uprice{width:92px;text-align:right;padding:6px;}
.del{border:none;background:none;color:#c0392b;cursor:pointer;font-size:1.05rem;}
.empty{color:var(--muted);font-size:.86rem;text-align:center;padding:26px 0;}
.totals{margin-top:16px;border-top:2px solid var(--deep);padding-top:14px;}
.trow{display:flex;justify-content:space-between;padding:5px 0;font-size:.92rem;color:var(--muted);}
.trow.grand{font-size:1.25rem;font-weight:800;color:var(--deep);margin-top:6px;}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn{flex:1;min-width:140px;border:none;border-radius:999px;padding:13px 18px;font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s;}
.btn.wa{background:var(--deep);color:#fff;}.btn.wa:hover{background:var(--navy);}
.btn.pr{background:#fff;color:var(--navy);border:1px solid var(--navy);}.btn.pr:hover{background:var(--navy);color:#fff;}
.btn.cl{background:#fff;color:#c0392b;border:1px solid #f0c9c4;flex:none;min-width:auto;padding:13px 16px;}
.customadd{display:flex;gap:8px;margin-top:10px;}
.hint{font-size:.72rem;color:var(--muted);margin-top:8px;}
@media(max-width:900px){
 .app{grid-template-columns:1fr;padding:13px;gap:14px;}
 .panel{padding:15px;min-width:0;}
 .list{max-height:none;}            /* sin scroll interno: usa el scroll normal de la página */
 .controls{flex-direction:column;}
 .search,.filter{min-width:0;width:100%;flex:1 1 auto;}
 .prod{gap:10px;padding:11px 10px;}
 .prod .add{width:32px;height:32px;flex:none;}
 .cust{grid-template-columns:1fr;}
 table{font-size:.82rem;}
 .qty{width:44px;padding:5px;} .uprice{width:70px;padding:5px;}
 thead th{font-size:.62rem;}
 .actions{position:sticky;bottom:0;background:#fff;padding-top:10px;}
}
/* print */
#doc{display:none;}
@media print{
 body{background:#fff;}
 .app{display:none;}
 #doc{display:block;padding:0;font-size:12px;color:#000;}
 @page{margin:16mm;}
}
#doc .dh{display:flex;justify-content:space-between;border-bottom:3px solid #0A1128;padding-bottom:12px;margin-bottom:16px;}
#doc h3{font-size:22px;color:#0A1128;}
#doc .meta td{padding:2px 8px;font-size:12px;}
#doc table.q{width:100%;border-collapse:collapse;margin-top:14px;}
#doc table.q th{background:#0A1128;color:#fff;padding:7px;font-size:11px;text-align:left;}
#doc table.q td{border-bottom:1px solid #ddd;padding:6px 7px;font-size:11px;}
#doc .tot{margin-top:14px;width:46%;margin-left:auto;}
#doc .tot div{display:flex;justify-content:space-between;padding:4px 0;}
#doc .tot .g{font-weight:800;font-size:15px;border-top:2px solid #0A1128;padding-top:6px;}
#doc .terms{margin-top:22px;font-size:10.5px;color:#444;border-top:1px solid #ccc;padding-top:10px;}
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div><h1>Cotizador Jonets Group</h1></div>
    <span>Medicina &amp; Salud</span>
  </div>

  <!-- IZQUIERDA: catálogo -->
  <div class="panel">
    <h2>Catálogo de productos</h2>
    <div class="controls">
      <input class="search" id="q" placeholder="Buscar producto…" oninput="render()">
      <select class="filter" id="cat" onchange="render()"><option value="">Todas las categorías</option></select>
    </div>
    <div class="list" id="list"></div>
    <div class="customadd">
      <input id="cname" placeholder="Producto personalizado…">
      <input id="cprice" class="uprice" type="number" placeholder="$0" style="width:110px">
      <button class="prod add" style="width:40px;height:40px" onclick="addCustom()">+</button>
    </div>
    <p class="hint">Toca un producto para agregarlo. Puedes editar cantidad y precio en la cotización.</p>
  </div>

  <!-- DERECHA: cotización -->
  <div class="panel">
    <h2>Datos del cliente</h2>
    <div class="cust">
      <div class="full"><label>Cliente / Empresa</label><input id="c_emp" placeholder="Nombre del cliente"></div>
      <div><label>Contacto</label><input id="c_con" placeholder="Persona"></div>
      <div><label>Folio</label><input id="c_folio" placeholder="COT-0001"></div>
      <div><label>Vendedor</label><input id="c_vend" placeholder="Ej. Rafael Ríos"></div>
      <div><label>Vigencia</label><input id="c_vig" value="15 días hábiles"></div>
    </div>
    <h2>Cotización</h2>
    <table>
      <thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">P. Unit.</th><th class="r">Importe</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="emptymsg" class="empty">Agrega productos desde el catálogo.</div>
    <div class="totals">
      <div class="trow"><span>Subtotal</span><span id="t_sub">$0.00</span></div>
      <div class="trow"><span>IVA (16%)</span><span id="t_iva">$0.00</span></div>
      <div class="trow grand"><span>Total</span><span id="t_tot">$0.00</span></div>
    </div>
    <div class="actions">
      <button class="btn pr" onclick="doPrint()">🖨️ Imprimir / PDF</button>
      <button class="btn wa" onclick="sendWA()">Enviar por WhatsApp</button>
      <button class="btn cl" onclick="clearAll()">Vaciar</button>
    </div>
  </div>
</div>

<!-- Documento imprimible -->
<div id="doc"></div>

let cart=[];
const money=n=>'$'+(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const imgSrc=p=>p.img||p.imgurl||'';
function imgErr(el){el.onerror=null;el.parentNode.innerHTML='<span>+</span>';}

// categorías
const cats=[...new Set(PRODUCTS.map(p=>p.cat))].sort();
const cs=document.getElementById('cat');
cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o);});

function render(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const cf=document.getElementById('cat').value;
  const list=document.getElementById('list');
  const rows=PRODUCTS.filter(p=>(!cf||p.cat===cf)&&(!q||p.name.toLowerCase().includes(q)));
  list.innerHTML=rows.map((p)=>{
    const i=PRODUCTS.indexOf(p);
    const _s=imgSrc(p);const th=_s?`<div class="thumb"><img src="${_s}" loading="lazy" alt="" onerror="imgErr(this)"></div>`:`<div class="thumb"><span>+</span></div>`;
    return `<div class="prod" onclick="add(${i})">
      ${th}
      <div class="info"><div class="nm">${p.name}</div><div class="ct">${p.cat}</div></div>
      <div class="pr">${money(p.price)}</div>
      <button class="add" onclick="event.stopPropagation();add(${i})">+</button></div>`;
  }).join('')||'<div class="empty">Sin resultados.</div>';
}
function add(i){const p=PRODUCTS[i];const e=cart.find(x=>x.name===p.name);
  if(e)e.qty++;else cart.push({name:p.name,price:p.price,qty:1,img:p.img,imgurl:p.imgurl});renderCart();}
function addCustom(){const n=document.getElementById('cname').value.trim();
  const pr=parseFloat(document.getElementById('cprice').value)||0;
  if(!n)return;cart.push({name:n,price:pr,qty:1,img:''});
  document.getElementById('cname').value='';document.getElementById('cprice').value='';renderCart();}
function renderCart(){
  const tb=document.getElementById('rows');
  document.getElementById('emptymsg').style.display=cart.length?'none':'block';
  tb.innerHTML=cart.map((it,i)=>`<tr>
    <td>${imgSrc(it)?`<img class="cthumb" src="${imgSrc(it)}" alt="" onerror="imgErr(this)">`:'<span class="noimg"></span>'}${it.name}</td>
    <td class="r"><input class="qty" type="number" min="1" value="${it.qty}" onchange="upd(${i},'qty',this.value)"></td>
    <td class="r"><input class="uprice" type="number" min="0" value="${it.price}" onchange="upd(${i},'price',this.value)"></td>
    <td class="r">${money(it.qty*it.price)}</td>
    <td class="r"><button class="del" onclick="rm(${i})">✕</button></td></tr>`).join('');
  totals();
}
function upd(i,k,v){cart[i][k]=Math.max(k==='qty'?1:0,parseFloat(v)||0);renderCart();}
function rm(i){cart.splice(i,1);renderCart();}
function clearAll(){if(cart.length&&!confirm('¿Vaciar la cotización?'))return;cart=[];renderCart();}
function calc(){const sub=cart.reduce((s,x)=>s+x.qty*x.price,0);const iva=sub*0.16;return{sub,iva,tot:sub+iva};}
function totals(){const t=calc();
  document.getElementById('t_sub').textContent=money(t.sub);
  document.getElementById('t_iva').textContent=money(t.iva);
  document.getElementById('t_tot').textContent=money(t.tot);}
function sendWA(){
  if(!cart.length){alert('Agrega productos primero.');return;}
  const t=calc();const emp=document.getElementById('c_emp').value||'Cliente';
  let m='*Cotización Jonets Group*\nCliente: '+emp+'\n\n';
  cart.forEach(x=>{m+='• '+x.qty+' x '+x.name+' — '+money(x.qty*x.price)+'\n';});
  m+='\nSubtotal: '+money(t.sub)+'\nIVA 16%: '+money(t.iva)+'\nTotal: '+money(t.tot);
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(m),'_blank');
}
function doPrint(){
  if(!cart.length){alert('Agrega productos primero.');return;}
  const t=calc();const g=id=>document.getElementById(id).value;
  const today=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
  const rows=cart.map(x=>`<tr><td>${imgSrc(x)?`<img src="${imgSrc(x)}" style="width:34px;height:34px;object-fit:contain;vertical-align:middle;margin-right:6px;border:1px solid #eee">`:""}${x.name}</td><td style="text-align:center">${x.qty}</td><td style="text-align:right">${money(x.price)}</td><td style="text-align:right">${money(x.qty*x.price)}</td></tr>`).join('');
  document.getElementById('doc').innerHTML=`
    <div class="dh"><div><h3>JONETS GROUP</h3><div style="font-size:12px;color:#555">Proveedor Integral · Medicina y Salud</div></div>
      <div style="text-align:right;font-size:12px"><b>COTIZACIÓN</b><br>Folio: ${g('c_folio')||'—'}<br>Fecha: ${today}</div></div>
    <table class="meta"><tr><td><b>Cliente:</b> ${g('c_emp')||'—'}</td><td><b>Contacto:</b> ${g('c_con')||'—'}</td></tr>
      <tr><td><b>Vendedor:</b> ${g('c_vend')||'—'}</td><td><b>Vigencia:</b> ${g('c_vig')||'—'}</td></tr></table>
    <table class="q"><thead><tr><th>Descripción</th><th style="width:60px;text-align:center">Cant.</th><th style="width:90px;text-align:right">P. Unitario</th><th style="width:100px;text-align:right">Importe</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="tot"><div><span>Subtotal</span><span>${money(t.sub)}</span></div>
      <div><span>IVA (16%)</span><span>${money(t.iva)}</span></div>
      <div class="g"><span>TOTAL</span><span>${money(t.tot)}</span></div></div>
    <div class="terms">Precios en pesos mexicanos (MXN). Cotización sujeta a disponibilidad. Tiempo de entrega estimado según existencia. Gracias por su preferencia — Jonets System Networks.</div>`;
  window.print();
}
render();renderCart();
</script>
